[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parser"
version = "0.1.0"
description = "AI-assisted Avito deal finder for second-hand electronics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic>=2.11,<2.12",
  "pydantic-settings>=2.10,<2.11",
  "sqlmodel>=0.0.24,<0.0.25",
  "httpx>=0.28,<0.29",
  "playwright>=1.54,<1.55",
  "beautifulsoup4>=4.13,<4.14",
  "lxml>=5.4,<6",
  "numpy>=2.2,<2.3",
  "ddgs>=9.0,<9.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<8.5",
  "pytest-asyncio>=1.1,<1.2",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
