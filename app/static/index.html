<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parser</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">SMART PARSER</div>
        <h1>Поиск недооценённой техники на Avito</h1>
        <p>Рынок, feature map, vision-анализ, web research и ожидаемая маржа в одном интерфейсе.</p>
      </div>
      <div id="health" class="pill">Проверяю конфигурацию…</div>
    </header>

    <section class="panel">
      <form id="search-form">
        <label class="field wide">
          <span>Что ищем</span>
          <textarea id="prompt" rows="3" placeholder="Ноутбуки до 15к с маржой от 4к, ThinkPad/Dell/HP, без серьёзного ремонта"></textarea>
        </label>
        <div class="grid">
          <label class="field"><span>Категория</span>
            <select id="category">
              <option value="laptops">Ноутбуки</option>
              <option value="phones">Телефоны</option>
              <option value="tablets">Планшеты</option>
              <option value="desktops">Компьютеры</option>
              <option value="cameras">Фототехника</option>
              <option value="electronics">Электроника</option>
            </select>
          </label>
          <label class="field"><span>Город</span>
            <select id="city">
              <option value="sankt-peterburg">Санкт-Петербург</option>
              <option value="moskva">Москва</option>
            </select>
          </label>
          <label class="field"><span>Цена до, ₽</span><input id="max-price" type="number" value="15000"></label>
          <label class="field"><span>Целевая маржа, ₽</span><input id="min-profit" type="number" value="3000"></label>
          <label class="field"><span>Страниц</span><input id="pages" type="number" min="1" max="6" value="2"></label>
          <label class="field"><span>Глубоко проверить</span><input id="deep-n" type="number" min="1" max="30" value="10"></label>
        </div>
        <details>
          <summary>Расширенные настройки</summary>
          <label class="field wide"><span>Готовая Avito-ссылка</span><input id="custom-url" type="url"></label>
          <label class="check"><input id="vision" type="checkbox" checked> Vision-анализ фото</label>
          <label class="check"><input id="web-research" type="checkbox" checked> Дополнительный поиск в интернете</label>
        </details>
        <button id="submit" type="submit">Найти выгодные предложения</button>
      </form>
    </section>

    <section id="progress" class="panel hidden">
      <div class="row"><div><b id="stage">QUEUED</b><div id="message"></div></div><strong id="percent">0%</strong></div>
      <div class="track"><div id="bar"></div></div>
      <div id="spec" class="muted"></div>
    </section>

    <section id="results-section" class="hidden">
      <div class="row"><h2>Лучшие сделки</h2><div id="count" class="pill"></div></div>
      <div id="results"></div>
    </section>
  </main>

  <dialog id="modal"><button id="close">Закрыть</button><pre id="modal-body"></pre></dialog>
  <script src="/static/app.js"></script>
</body>
</html>
