<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parser</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">SMART PARSER</div>
        <h1>Выгодные объявления Avito</h1>
        <p>Быстрый поиск без открытия каждой карточки: отсев мусора, сравнение цен и готовые ссылки.</p>
      </div>
      <div id="health" class="pill">Проверяю конфигурацию…</div>
    </header>

    <section class="panel">
      <form id="search-form">
        <label class="field wide">
          <span>Что ищем</span>
          <textarea id="prompt" rows="3" placeholder="Ноутбуки до 15к с маржой от 4к, ThinkPad/Dell/HP, не запчасти и не опт"></textarea>
        </label>
        <div class="grid">
          <label class="field"><span>Категория</span>
            <select id="category">
              <option value="laptops">Ноутбуки</option>
              <option value="phones">Телефоны</option>
              <option value="tablets">Планшеты</option>
              <option value="desktops">Компьютеры</option>
              <option value="cameras">Фототехника</option>
              <option value="electronics">Электроника</option>
            </select>
          </label>
          <label class="field"><span>Город</span>
            <select id="city">
              <option value="sankt-peterburg">Санкт-Петербург</option>
              <option value="moskva">Москва</option>
            </select>
          </label>
          <label class="field"><span>Цена до, ₽</span><input id="max-price" type="number" value="15000"></label>
          <label class="field"><span>Минимальная маржа, ₽</span><input id="min-profit" type="number" value="3000"></label>
          <label class="field"><span>Страниц Avito</span><input id="pages" type="number" min="1" max="6" value="2"></label>
          <label class="field"><span>Сколько ссылок показать</span><input id="result-limit" type="number" min="1" max="100" value="25"></label>
        </div>
        <details>
          <summary>Готовая ссылка Avito вместо автоматических фильтров</summary>
          <label class="field wide"><span>Avito URL</span><input id="custom-url" type="url"></label>
        </details>
        <button id="submit" type="submit">Найти предложения</button>
      </form>
    </section>

    <section id="progress" class="panel hidden">
      <div class="row">
        <div>
          <b id="stage">Ожидание</b>
          <div id="message"></div>
        </div>
        <strong id="percent">0%</strong>
      </div>
      <div class="track"><div id="bar"></div></div>
      <div id="spec" class="muted"></div>
    </section>

    <section id="results-section" class="hidden">
      <div class="row"><h2>Подходящие объявления</h2><div id="count" class="pill"></div></div>
      <div id="results" class="link-list"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
